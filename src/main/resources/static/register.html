<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container d-flex justify-content-center">
		<h2>Sign Up</h2>
		<form onsubmit="saveUser(event)">
			<table>
				<tr>
					<td><input type="text" id="name" placeholder="Enter name" required></td>
				</tr>
				<tr>
					<td><input type="number" id="phno" placeholder="Enter mobile number" required></td>
				</tr>
				<tr>
					<td><input type="email" id="email" placeholder="Enter Email" required></td>
				</tr>
				<tr>
					<td><input type="password" id="pwd" placeholder="Enter new password" required></td>
				</tr>
				<tr>
					<td><input type="submit" id="submit" ></td>
				</tr>
			</table>
			<a href="login.html" class="btn btn-primary">login</a>
		</form>
	</div>
    <script> 
		function saveUser(event) {
			 event.preventDefault();
			 let user = { name: document.getElementById("name").value,
						  phno: document.getElementById("phno").value,
						  email: document.getElementById("email").value,
						  pwd: document.getElementById("pwd").value };
			fetch("/register", { 
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify(user)
			})
				
			.then(function(response) {
				if(response.status == 201) {
					return response.text();
				} else {
					throw "Registration Failed";
				}
			})
				
			.then(function(data) {
				alert("User Registered Successfully");
				window.location.href = "login.html";
			})
			
			.catch(function(error) {
				alert(error);
			});
		}
	</script>
  </body>
</html>
